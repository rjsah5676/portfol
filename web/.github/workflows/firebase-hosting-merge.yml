# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
  # study 글은 빌드 시점에 정적 생성되므로, 글 쓴 뒤 Actions 탭에서 수동 재배포
  workflow_dispatch:
  # 수동 실행을 깜빡해도 하루 안에는 반영되게 매일 04:00 KST 재빌드
  schedule:
    - cron: "0 19 * * *"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      # Firestore 보안 규칙도 같이 배포 (새 게임 컬렉션 규칙이 새 코드보다 먼저 올라가게 호스팅 전에)
      # 서비스 계정에 'Firebase Rules 관리자'(roles/firebaserules.admin) 역할이 있어야 함
      - name: Deploy Firestore rules
        env:
          SA_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUNMO_PORTFOLIO }}"
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx -y firebase-tools@latest deploy --only firestore:rules --project gunmo-portfolio --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUNMO_PORTFOLIO }}"
          channelId: live
          projectId: gunmo-portfolio
      # rjsah5676.github.io(GitHub Pages)도 계속 쓰기 위해 gh-pages 브랜치에도 같이 배포
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: ./build
