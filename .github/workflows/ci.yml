name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치·PR 에 새 커밋이 오면 앞선 실행은 취소 (main 은 끝까지 돌림)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 서버: 타입 검사 + 테스트 ──
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # 테스트는 이 주소의 DB를 씀 (server/test/globalSetup.ts). 테스트마다 임시 DB를 만들고 지움
      MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── 프론트: 린트 + 타입 검사 + 빌드 ──
  # 글·랭킹·방명록은 요청이 올 때 서버에서 읽어 그리므로(SSR) 빌드에는 API 서버가 필요 없다.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://gunmo.my' }}

  # ── Docker 이미지 (server · web): PR 에서는 빌드만, main push 에서는 GHCR 에 올림 ──
  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # server 는 web 의 게임 엔진 소스를 같이 묶으므로 빌드 기준 폴더가 레포 루트
          - name: server
            context: .
            file: server/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 이미지 이름·태그 (이름은 소문자로 바꿔 줌): latest + 커밋 해시
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 사이트 주소는 web 이미지에 박힘 (server 이미지는 이 값을 쓰지 않음)
          build-args: |
            NEXT_PUBLIC_API_URL=/
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://gunmo.my' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

# ─────────────────────────────────────────────────────────────────────────────
# 배포는 아직 없음 (서버를 정하면 아래 job 을 추가)
#
#   deploy:
#     needs: docker
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     steps: ssh 로 VM 접속 → 레포의 docker-compose.yml · Caddyfile · .env 가 있는 폴더에서
#            docker compose pull server web && docker compose up -d --no-build
#   (.env 에 SERVER_IMAGE=ghcr.io/<owner>/<repo>-server:latest, WEB_IMAGE=…-web:latest 지정)
# ─────────────────────────────────────────────────────────────────────────────
