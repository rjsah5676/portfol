name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

# 같은 브랜치·PR 에 새 커밋이 오면 앞선 실행은 취소 (main 은 끝까지 돌림)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 서버: 타입 검사 + 테스트 ──
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mirror.gcr.io/library/mongo:7  # Docker Hub 대신 같은 공식 이미지의 Google 미러 (Docker Hub 는 횟수 제한, AWS 공개 미러는 러너 IP 공용 데이터 한도 429)
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # 테스트는 이 주소의 DB를 씀 (server/test/globalSetup.ts). 테스트마다 임시 DB를 만들고 지움
      MONGODB_URI: mongodb://localhost:27017
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── 프론트: 린트 + 타입 검사 ──
  # next build 는 docker 잡(web 이미지)에서 한 번만 함 — 여기서 또 하면 Actions 시간이 두 배로 듦
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── Docker 이미지 (server · web): PR 에서는 빌드만, main push 에서는 GHCR 에 올림 ──
  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # server 는 web 의 게임 엔진 소스를 같이 묶으므로 빌드 기준 폴더가 레포 루트
          - name: server
            context: .
            file: server/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 이미지 이름·태그 (이름은 소문자로 바꿔 줌): latest + 커밋 해시
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 사이트 주소는 web 이미지에 박힘 (server 이미지는 이 값을 쓰지 않음)
          build-args: |
            NEXT_PUBLIC_API_URL=/
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://gunmo.my' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── 서버에 반영: 새 이미지가 올라간 뒤 서버에 접속해서 이미지를 받아 다시 띄움 (scripts/deploy.sh) ──
  # 저장소 Settings → Secrets and variables → Actions 에 아래 값이 있어야 동작 (DEPLOY_HOST 가 없으면 건너뜀)
  #   Variables: DEPLOY_HOST (서버 IP 또는 도메인), DEPLOY_USER (기본 ubuntu), DEPLOY_PATH (기본 app = ~/app)
  #   Secrets:   DEPLOY_SSH_KEY (배포 전용 개인키. 공개키는 서버 ~/.ssh/authorized_keys 에)
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
      APP_DIR: ${{ vars.DEPLOY_PATH || 'app' }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
      - name: 설정 파일·스크립트 복사
        run: scp -i ~/.ssh/deploy_key -r docker-compose.yml Caddyfile scripts "$TARGET:$APP_DIR/"
      # 이번 실행의 토큰으로만 이미지를 받음 (표준 입력으로 넘겨서 서버에 남기지 않음)
      # 이미지 이름은 docker job 이 올린 이름(ghcr.io/<레포>-server · -web, 소문자)을 그대로 넘김 — 서버 .env 의 SERVER_IMAGE · WEB_IMAGE 보다 앞섬.
      #   (레포 이름이 gunmo.my → portfol 로 바뀐 뒤 서버가 옛 이미지 gunmo.my-*:latest 만 받아서 배포가 멈췄던 일 — 2026-10-19)
      - name: 이미지 받아 다시 띄우기
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMG: ghcr.io/${{ github.repository }}
        run: |
          IMG="${IMG,,}"
          ssh -i ~/.ssh/deploy_key "$TARGET" "GHCR_USER='$GHCR_USER' SERVER_IMAGE='$IMG-server:latest' WEB_IMAGE='$IMG-web:latest' bash '$APP_DIR/scripts/deploy.sh'" <<< "$GHCR_TOKEN"